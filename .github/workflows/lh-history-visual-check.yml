name: LH history visual check
on:
  push:
    branches: [research/lh-whale-dashboard-history-20261114]
  pull_request:
    branches: [v8-fly-layer-test]
    paths: [lh_whale_dashboard.py, app_v8_fly.py, tools/check_lh_history_ui.py, .github/workflows/lh-history-visual-check.yml]
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_lh_history_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lh-history-visual-check
          path: ui-check-artifacts/
          retention-days: 7
