name: A4 Vortex+CHOP 5/15m BTC diagnostic (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
on:
  push:
    branches: ["research/vortex-chop-*"]
    paths:
      - "research/vortex_chop/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_vortex_chop.py tests/test_deflated_sharpe.py
      - name: Diagnostic per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.vortex_chop.run --cache /tmp/vision-a4 --outdir research/vortex_chop | tee research/vortex_chop/summary.txt
      - name: Independent recompute from trades.csv.gz
        run: python research/vortex_chop/verify.py research/vortex_chop | tee -a research/vortex_chop/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-chop
          path: research/vortex_chop/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/vortex_chop/
          git diff --cached --quiet && exit 0
          git commit -m "A4: vortex+chop results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
