name: Data investigation kolo 10 (PAPER research, public data only, no performance)
# Jen izolovaná výzkumná větev. Žádné secrets, žádný Render, žádné objednávky, žádný výpočet výkonnosti.
on:
  push:
    branches: ["research/data-investigation-*"]
    paths:
      - "research/data_investigation/investigate3.py"
      - "research/data_investigation/investigate4.py"
      - ".github/workflows/data-investigation.yml"
permissions:
  contents: write
concurrency:
  group: data-investigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Investigate archive gaps (read-only public data)
        run: python research/data_investigation/investigate4.py research/data_investigation/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-investigation
          path: research/data_investigation/out/
      - name: Commit report to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/data_investigation/out/
          git diff --cached --quiet && exit 0
          git commit -m "Data investigation kolo 10: report (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
