name: XRP one-day public archive QA (research only)
on:
  push:
    branches: [research/xrp-top-risk-radar-v1-20261108]
    paths:
      - research/top_risk_radar_v1/inspect_one_archive.py
      - .github/workflows/xrp-radar-archive-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official checksum and summarize one daily archive
        run: python -m research.top_risk_radar_v1.inspect_one_archive | tee archive_qa.json
      - name: Upload provenance report only (not raw trade data)
        uses: actions/upload-artifact@v4
        with:
          name: xrp-archive-qa-2024-01-02
          path: archive_qa.json
          retention-days: 30
