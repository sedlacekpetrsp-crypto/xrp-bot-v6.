name: XRP radar unit tests (research only)
on:
  workflow_dispatch:
  push:
    branches:
      - research/xrp-top-risk-radar-v1-20261108
      - research/radar-p3-contract-20261112
      - claude/radar-p3-pipeline-20261112
    paths:
      - 'research/top_risk_radar_v1/*.py'
      - 'research/early_growth_radar_v1/*.py'
      - '.github/workflows/xrp-radar-unit-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q research/top_risk_radar_v1 research/early_growth_radar_v1
      - name: Install pinned test runner
        run: python -m pip install pytest==8.3.3
      - name: Run deterministic unit tests (no network, no trading)
        run: python -m pytest -q research/top_risk_radar_v1 research/early_growth_radar_v1
