name: BAB beta 8 perps backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
# Backtest se spouští jen commitem research/bab_beta/RUN_REQUEST.
on:
  push:
    branches: ["research/bab-beta-*"]
    paths:
      - "research/bab_beta/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_bab_beta.py tests/test_deflated_sharpe.py
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.bab_beta.run --cache /tmp/vision-bab --outdir research/bab_beta | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bab-beta
          path: research/bab_beta/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/bab_beta/
          git diff --cached --quiet && exit 0
          git commit -m "BAB beta: backtest results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
