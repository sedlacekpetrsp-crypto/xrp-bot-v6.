name: Blue Whale actual-post audit

on:
  push:
    branches: [research-blue-whale-public]
    paths:
      - "research_blue_whale_posts_audit.py"
      - ".github/workflows/blue-whale-post-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actual public-post audit
        run: python research_blue_whale_posts_audit.py
