name: A1 new-listing drift backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
on:
  push:
    branches: ["research/new-listing-drift-*"]
    paths:
      - "research/new_listing_drift/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_new_listing_drift.py tests/test_deflated_sharpe.py
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.new_listing_drift.run --cache /tmp/vision-nld --outdir research/new_listing_drift | tee summary.txt
      - name: Independent recompute from trades.csv
        run: python research/new_listing_drift/verify.py research/new_listing_drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-listing-drift
          path: research/new_listing_drift/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/new_listing_drift/
          git diff --cached --quiet && exit 0
          git commit -m "A1 step 2: new-listing drift results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
