name: ELITE research unit tests
on:
  push:
    branches: [elite-research-v1]
    paths:
      - 'elite/**'
      - '.github/workflows/elite-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s elite -p 'test_*.py' -v
