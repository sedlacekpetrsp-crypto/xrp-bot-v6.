name: Contrarian ladder 8 assets backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
# Spouští se jen commitem research/contrarian_ladder/RUN_REQUEST (backtest až od 2026-11-07, denní limit hypotéz).
on:
  push:
    branches: ["research/contrarian-ladder-*"]
    paths:
      - "research/contrarian_ladder/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_contrarian_ladder.py tests/test_deflated_sharpe.py
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.contrarian_ladder.run --cache /tmp/vision-1d --outdir research/contrarian_ladder | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrarian-ladder
          path: research/contrarian_ladder/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/contrarian_ladder/
          git diff --cached --quiet && exit 0
          git commit -m "Contrarian ladder: backtest results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
