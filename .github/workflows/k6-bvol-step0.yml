name: K6 step 0 BVOLIndex data audit (PAPER research, metadata only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky, žádné výnosy.
on:
  push:
    branches: ["research/k6-bvol-audit-*"]
    paths:
      - "research/k6_bvol_audit/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest && python -m pytest -q -p no:cacheprovider tests/test_k6_bvol_step0.py
      - name: Data audit (public Binance Vision, metadata only)
        run: |
          set -o pipefail
          python -m research.k6_bvol_audit.step0 run --outdir research/k6_bvol_audit | tee research/k6_bvol_audit/step0_summary.txt
      - name: Commit metadata results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/k6_bvol_audit/step0_* || true
          git diff --cached --quiet && exit 0
          git commit -m "K6 krok 0: výsledky datového auditu (run ${GITHUB_RUN_ID}) [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
