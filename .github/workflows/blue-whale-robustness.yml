name: Blue Whale robustness only

on:
  push:
    branches: [research-blue-whale-public]
    paths:
      - "research_blue_whale_robustness.py"
      - ".github/workflows/blue-whale-robustness.yml"
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed-parameter robustness audit
        run: python research_blue_whale_robustness.py
