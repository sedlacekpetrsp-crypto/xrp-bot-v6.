name: K7 step 0 FOMC calendar PIT audit (PAPER research, metadata only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky, žádné výnosy.
on:
  push:
    branches: ["research/k7-macro-audit-*"]
    paths:
      - "research/k7_macro_calendar/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest && python -m pytest -q -p no:cacheprovider tests/test_k7_macro_step0.py
      - name: PIT data audit (Wayback snapshots, federalreserve.gov, Binance Vision)
        run: |
          set -o pipefail
          python -m research.k7_macro_calendar.step0 run --outdir research/k7_macro_calendar | tee research/k7_macro_calendar/step0_summary.txt
      - name: Commit metadata results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/k7_macro_calendar/step0_* || true
          git diff --cached --quiet && exit 0
          git commit -m "K7 krok 0: výsledky PIT auditu (run ${GITHUB_RUN_ID}) [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
