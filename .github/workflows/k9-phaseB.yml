name: K9 phase B returns (PAPER research, owner approval required)
# Jen výzkumné větve. Žádné secrets, žádný Render, žádné objednávky. Runner je FAIL CLOSED:
# bez řádku „<datum> SCHVÁLENO: výkonnost K9“ v dialog/OWNER_DECISIONS.md nic nenačte ani nespočte.
# Fáze dev a final jsou oddělené commity (RUN_REQUEST_PHASEB_DEV, pak RUN_REQUEST_PHASEB_FINAL po commitu výběru H*).
on:
  push:
    branches: ["research/k9-phaseB-*"]
    paths:
      - "research/k9_round_number/RUN_REQUEST_PHASEB_DEV"
      - "research/k9_round_number/RUN_REQUEST_PHASEB_FINAL"
permissions:
  contents: write
jobs:
  phaseB:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pandas numpy scipy && python -m pytest -q -p no:cacheprovider tests/test_k9_phase_b.py tests/test_deflated_sharpe.py tests/test_k9_round_number.py tests/test_k9_step0_phase_a.py
      - name: Owner decisions (read-only copy from dialog branch)
        run: git fetch origin dialog/claude-chatgpt && git show origin/dialog/claude-chatgpt:dialog/OWNER_DECISIONS.md > /tmp/OWNER_DECISIONS.md
      - name: Stage selection
        id: st
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q RUN_REQUEST_PHASEB_FINAL; then echo "stage=final" >> $GITHUB_OUTPUT; else echo "stage=dev" >> $GITHUB_OUTPUT; fi
      - name: Phase B (${{ steps.st.outputs.stage }})
        run: |
          set -o pipefail
          python -m research.k9_round_number.phase_b_run --stage ${{ steps.st.outputs.stage }} --owner-decisions /tmp/OWNER_DECISIONS.md | tee research/k9_round_number/phaseB_${{ steps.st.outputs.stage }}_summary.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/k9_round_number/phaseB_* || true
          git diff --cached --quiet && exit 0
          git commit -m "K9 fáze B ${{ steps.st.outputs.stage }} (run ${GITHUB_RUN_ID}) [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
