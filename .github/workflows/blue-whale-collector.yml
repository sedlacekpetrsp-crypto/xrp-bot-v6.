name: Blue Whale public-post collector

on:
  push:
    branches: [research-blue-whale-public]
    paths:
      - "collect_blue_whale_public_posts.py"
      - ".github/workflows/blue-whale-collector.yml"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect public Telegram posts
        run: python collect_blue_whale_public_posts.py
      - name: Upload collected posts
        uses: actions/upload-artifact@v4
        with:
          name: blue-whale-public-posts
          path: blue_whale_public_posts.json
