name: RSI(2) cross-asset backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
# Výsledky (trades.csv, results.json, RESULTS.md, data_source.json) commitne zpět do stejné větve.
on:
  push:
    branches: ["research/rsi2-cross-asset-*"]
    paths:
      - ".github/workflows/rsi2-cross-asset.yml"
      - "research/rsi2_cross_asset/run.py"
      - "tests/test_rsi2_cross_asset.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_rsi2_cross_asset.py
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.rsi2_cross_asset.run --cache /tmp/vision-1d --outdir research/rsi2_cross_asset | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi2-cross-asset
          path: research/rsi2_cross_asset/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/rsi2_cross_asset/
          git diff --cached --quiet && exit 0
          git commit -m "RSI(2) cross-asset: backtest results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
