name: K10 step 0 ledger source probe (PAPER research, data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné ceny, žádný Wayback/CDX, žádný výkon.
on:
  push:
    branches: ["research/k10-step0-*"]
    paths:
      - "research/k10_step0/RUN_REQUEST_LEDGER_PROBE"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest && python -m pytest -q -p no:cacheprovider tests -k k10
      - name: Probe XRPL full-history JSON-RPC (metadata + cost only)
        run: |
          set -o pipefail
          python -m research.k10_step0.ledger_probe --out research/k10_step0/ledger_probe.json | tee research/k10_step0/ledger_probe_summary.txt
      - name: Commit probe metadata
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/k10_step0/ledger_probe* || true
          git diff --cached --quiet && exit 0
          git commit -m "K10 krok 0 §6.3: ledger probe (run ${GITHUB_RUN_ID}) [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
