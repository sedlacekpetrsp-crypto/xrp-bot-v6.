name: R13 cross-sectional momentum L/S 8 perps backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
# Backtest se spouští jen commitem research/xs_momentum/RUN_REQUEST.
on:
  push:
    branches: ["research/xs-momentum-*"]
    paths:
      - "research/xs_momentum/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_xs_momentum.py tests/test_deflated_sharpe.py
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.xs_momentum.run --cache /tmp/vision-mom --outdir research/xs_momentum | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xs-momentum
          path: research/xs_momentum/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/xs_momentum/
          git diff --cached --quiet && exit 0
          git commit -m "R13 XS momentum: backtest results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
