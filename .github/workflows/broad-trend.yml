name: A2 broad trend backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
on:
  push:
    branches: ["research/broad-trend-*"]
    paths:
      - "research/broad_trend/RUN_REQUEST"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_broad_trend.py tests/test_deflated_sharpe.py
      - uses: actions/cache@v4
        with:
          path: /tmp/vision-bt
          key: vision-bt-1d-v1-${{ github.run_id }}
          restore-keys: vision-bt-1d-v1-
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.broad_trend.run --cache /tmp/vision-bt --outdir research/broad_trend | tee research/broad_trend/summary.txt
      - name: Independent recompute from trades.csv.gz
        run: python research/broad_trend/verify.py research/broad_trend | tee -a research/broad_trend/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-trend
          path: research/broad_trend/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/broad_trend/
          git diff --cached --quiet && exit 0
          git commit -m "A2 step 2: broad trend results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
