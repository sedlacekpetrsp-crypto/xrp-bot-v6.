name: Keep Render bots awake

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keep-render-awake.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake V8 Candle Scanner (includes Fly V10/V11)
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            https://xrp-bot-v8-candle-scanner.onrender.com/health > /dev/null

      - name: Wake V8.1 Candle
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            https://xrp-bot-v8-1-candle.onrender.com/health > /dev/null

      - name: Wake V9 Best-Of
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            https://xrp-bot-v9-best-of.onrender.com/ > /dev/null

      - name: Wake Blue Whale Paper Mirror
        if: ${{ always() }}
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            https://blue-whale-paper-mirror.onrender.com/health > /dev/null
