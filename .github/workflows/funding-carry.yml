name: Funding carry backtest (PAPER research, public data only)
# Jen výzkumná větev. Žádné secrets, žádný Render, žádné objednávky.
on:
  push:
    branches: ["research/funding-carry-*"]
    paths:
      - ".github/workflows/funding-carry.yml"
      - "research/funding_carry/run.py"
      - "tests/test_funding_carry.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Mechanics tests (synthetic, not profitability evidence)
        run: python -m pytest -q -p no:cacheprovider tests/test_funding_carry.py tests/test_deflated_sharpe.py
      - name: Backtest per PROTOCOL.md
        run: |
          set -o pipefail
          python -m research.funding_carry.run --cache /tmp/vision --outdir research/funding_carry | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-carry
          path: research/funding_carry/
      - name: Commit results to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/funding_carry/
          git diff --cached --quiet && exit 0
          git commit -m "Funding carry: backtest results (run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
